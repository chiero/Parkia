<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkia — Ingreso</title>
  <meta name="description" content="Sistema de gestión de cocheras Parkia. Ingrese con sus credenciales.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">P</div>
      <h1>Parkia</h1>
      <p>Sistema de Gestión de Cocheras</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div style="display:flex;flex-direction:column;gap:1rem;">

        <div class="form-group">
          <label class="form-label" for="login-username">Usuario</label>
          <input class="form-control" type="text" id="login-username"
                 placeholder="Ingrese su usuario" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <input class="form-control" type="password" id="login-password"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" id="login-btn" style="margin-top:.5rem;">
          <span id="login-btn-text">Ingresar</span>
        </button>

      </div>
    </form>

    <p style="text-align:center;font-size:.72rem;color:var(--text-muted);margin-top:1.5rem;">
      Parkia © 2024 — v1.0
    </p>
  </div>
</div>

<!-- Hidden print area (for receipts printed from login page — safety) -->
<div id="print-area" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  (async () => {
    // If already logged in, redirect
    const existingSession = await Auth.restoreSession();
    if (existingSession) { window.location.href = 'app.html'; return; }

    // Login form
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn      = document.getElementById('login-btn');
      const btnText  = document.getElementById('login-btn-text');
      const errEl    = document.getElementById('login-error');
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      errEl.classList.remove('show');
      btn.disabled = true;
      btnText.textContent = 'Ingresando…';

      const result = await Auth.login(username, password);

      if (result.success) {
        btnText.textContent = '✓ Acceso concedido';
        setTimeout(() => { window.location.href = 'app.html'; }, 400);
      } else {
        errEl.textContent = result.error;
        errEl.classList.add('show');
        btn.disabled = false;
        btnText.textContent = 'Ingresar';
      }
    });
  })();
</script>
</body>
</html>
