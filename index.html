<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiclana Parking — Ingreso</title>
  <meta name="description" content="Sistema de gestión de cocheras Chiclana Parking. Ingrese con sus credenciales.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">🚗</div>
      <h1>Chiclana Parking</h1>
      <p>Sistema de Gestión de Cocheras</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div style="display:flex;flex-direction:column;gap:1rem;">

        <!-- Branch selector (solo visible si hay más de una) -->
        <div class="form-group" id="branch-group" style="display:none;">
          <label class="form-label" for="branch-select">Sucursal</label>
          <select class="form-control" id="branch-select"></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-username">Usuario</label>
          <input class="form-control" type="text" id="login-username"
                 placeholder="Ingrese su usuario" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <input class="form-control" type="password" id="login-password"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" id="login-btn" style="margin-top:.5rem;">
          <span id="login-btn-text">Ingresar</span>
        </button>

      </div>
    </form>

    <p style="text-align:center;font-size:.72rem;color:var(--text-muted);margin-top:1.5rem;">
      Chiclana Parking © 2024 — v1.0
    </p>
  </div>
</div>

<!-- Hidden print area (for receipts printed from login page — safety) -->
<div id="print-area" style="display:none;"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  Storage.initialize();

  // Populate branch selector
  const branches = Storage.branches.getAll();
  const branchGroup = document.getElementById('branch-group');
  const branchSelect = document.getElementById('branch-select');

  if (branches.length > 1) {
    branchGroup.style.display = '';
    branches.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.name;
      branchSelect.appendChild(opt);
    });
  }

  // If already logged in, redirect
  const existingSession = Auth.getSession();
  if (existingSession) window.location.href = 'app.html';

  // Login form
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn      = document.getElementById('login-btn');
    const btnText  = document.getElementById('login-btn-text');
    const errEl    = document.getElementById('login-error');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    errEl.classList.remove('show');
    btn.disabled = true;
    btnText.textContent = 'Ingresando…';

    setTimeout(() => {
      const result = Auth.login(username, password);

      if (result.success) {
        // Override branch if admin selected one
        if (branches.length > 1 && branchSelect.value) {
          Auth.setBranch(branchSelect.value);
        }
        btnText.textContent = '✓ Acceso concedido';
        setTimeout(() => { window.location.href = 'app.html'; }, 400);
      } else {
        errEl.textContent = result.error;
        errEl.classList.add('show');
        btn.disabled = false;
        btnText.textContent = 'Ingresar';
      }
    }, 350);
  });
</script>
</body>
</html>
